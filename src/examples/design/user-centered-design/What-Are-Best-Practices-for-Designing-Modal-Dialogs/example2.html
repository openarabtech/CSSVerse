<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Designing Modal Dialogs"/>
	<link rel="icon" type="image/x-icon" href="../../../../../favicon.png">
	<title>EXAMPLE 2</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

</head>
<style>
body {

  font-family: "Noto Kufi Arabic", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-weight: 400;
  

} 

.cta {
  background-color: #007BFF;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 4px;
  cursor: pointer;
}

.close {
  background-color: transparent;
  color: #007BFF;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
}

</style>

<body>

    <button id="open-modal" style="font-size: 1.2rem;">فتح النافذة المنبثقة</button>

    <dialog>
        <h2>اشترك في نشرتنا الإخبارية!</h2>
        <p>احصل على أحدث التحديثات والعروض.</p>
        <button class="cta">إشتراك</button>
        <button class="close">إغلاق</button>
    </dialog>



<script>
const dialog = document.querySelector('dialog');
const closeButton = dialog.querySelector('.close');
const openModalButton = document.getElementById('open-modal');

closeButton.addEventListener('click', () => {
  dialog.close();
});

openModalButton.addEventListener('click', () => {
  dialog.showModal();
});

// Close the modal when clicking outside of it
dialog.addEventListener('click', (event) => {
  const rect = dialog.getBoundingClientRect();
  const isInDialog = (
    event.clientX >= rect.left &&
    event.clientX <= rect.right &&
    event.clientY >= rect.top &&
    event.clientY <= rect.bottom
  );
  if (!isInDialog) {
    dialog.close();
  }
});
  
</script>

</body>
</html>
