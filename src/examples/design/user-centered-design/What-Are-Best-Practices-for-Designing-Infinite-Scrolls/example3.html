<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Designing Infinite Scrolls"/>
	<link rel="icon" type="image/x-icon" href="../../../../../favicon.png">
	<title>EXAMPLE 3</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

</head>
<style>
body {

  font-family: "Noto Kufi Arabic", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-weight: 400;
  font-size: larger;

} 

.infinite-scroll {
 display: flex;
 flex-direction: column;
 gap: 12px;
}

.post {
 padding: 12px;
 border: 1px solid #ccc;
 border-radius: 4px;
}

.load-more {
 margin-top: 12px;
 padding: 8px 16px;
}




</style>

<body>

<div class="infinite-scroll">
 <div class="post">المنشور 1</div>
 <div class="post">المنشور 2</div>
 <div class="post">المنشور 3</div>
 <!-- سيتم تحميل المزيد من المنشورات عندما ينقر المستخدم على "تحميل المزيد". -->
</div>

<button class="load-more">تحميل المزيد</button>
    



<script>
const loadMoreButton = document.querySelector('.load-more');
const container = document.querySelector('.infinite-scroll');

loadMoreButton.addEventListener('click', () => {
  loadMorePosts();
});

function loadMorePosts() {
  for (let i = 0; i < 3; i++) {
    const post = document.createElement('div');
    post.className = 'post';
    post.textContent = `المنشور ${container.children.length + 1}`;
    container.appendChild(post);
  }
}

  
</script>

</body>
</html>
