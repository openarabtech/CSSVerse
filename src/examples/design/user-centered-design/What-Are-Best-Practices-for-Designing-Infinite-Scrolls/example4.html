<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Designing Infinite Scrolls"/>
	<link rel="icon" type="image/x-icon" href="../../../../../favicon.png">
	<title>EXAMPLE 4</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

</head>
<style>
body {

  font-family: "Noto Kufi Arabic", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-weight: 400;
  font-size: larger;

} 

.infinite-scroll {
 display: flex;
 flex-direction: column;
 gap: 12px;
}

.post {
 padding: 12px;
 border: 1px solid #ccc;
 border-radius: 4px;
}

.loading-indicator {
 margin-top: 12px;
 font-weight: bold;
}

.back-to-top {
 position: fixed;
 bottom: 30px;
 right: 30px;
 display: none;
 padding: 10px 15px;
 background-color: #007BFF;
 color: white;
 border: none;
 border-radius: 4px;
 cursor: pointer;
 font-size: 14px;
 box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}

.back-to-top:hover {
 background-color: #0056b3;
}




</style>

<body>

<div class="infinite-scroll">
 <div class="post">المنشور 1</div>
 <div class="post">المنشور 2</div>
 <div class="post">المنشور 3</div>
 <div class="post">المنشور 4</div>
 <div class="post">المنشور 5</div>
 <div class="post">المنشور 6</div>
 <div class="post">المنشور 7</div>
 <div class="post">المنشور 8</div>
 <div class="post">المنشور 9</div>
 <div class="post">المنشور 10</div>
 <!-- سيتم تحميل المزيد من المنشورات هنا كلما قام المستخدم بالتمرير للأسفل -->
</div>

<div class="loading-indicator" style="display: none">تحميل...</div>

<button id="back-to-top" class="back-to-top">↑ العودة إلى الأعلى</div>
    



<script>
const container = document.querySelector('.infinite-scroll');
const loadingIndicator = document.querySelector('.loading-indicator');
const backToTopBtn = document.getElementById('back-to-top');

window.addEventListener('scroll', () => {
  if (window.scrollY > 400) {
    backToTopBtn.style.display = 'block';
  } else {
    backToTopBtn.style.display = 'none';
  }

  if (window.innerHeight + window.scrollY >= document.body.offsetHeight) {
    loadMorePosts();
  }
});

backToTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function loadMorePosts() {
  loadingIndicator.style.display = 'block';

  setTimeout(() => {
    for (let i = 0; i < 3; i++) {
      const post = document.createElement('div');
      post.className = 'post';
      post.textContent = `المنشور ${container.children.length + 1}`;
      container.appendChild(post);
    }

    loadingIndicator.style.display = 'none';
  }, 1000);
}

  
</script>

</body>
</html>
