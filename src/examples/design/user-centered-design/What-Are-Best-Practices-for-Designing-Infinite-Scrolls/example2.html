<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Designing Infinite Scrolls"/>
	<link rel="icon" type="image/x-icon" href="../../../../../favicon.png">
	<title>EXAMPLE 2</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

</head>
<style>
body {

  font-family: "Noto Kufi Arabic", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-weight: 400;
  font-size: larger;

} 

.pagination {
 display: flex;
 flex-direction: column;
 gap: 12px;
}

.post {
 padding: 12px;
 border: 1px solid #ccc;
 border-radius: 4px;
}

.pagination-controls {
 margin-top: 12px;
}

.pagination-controls button {
 padding: 8px 16px;
 margin-right: 8px;
}


</style>

<body>

<div class="pagination">
 <div class="post">المنشور 1</div>
 <div class="post">المنشور 2</div>
 <div class="post">المنشور 3</div>
 <!-- ستتوفر المزيد من المنشورات في الصفحات التالية. -->
</div>

<div class="pagination-controls">
 <button class="prev" disabled>السابق</button>
 <button class="next">التالي</button>
</div>
    



<script>

let currentPage = 1;
const postsPerPage = 3;
const totalPosts = 9;
const totalPages = Math.ceil(totalPosts / postsPerPage);
const container = document.querySelector('.pagination');
const prevButton = document.querySelector('.prev');
const nextButton = document.querySelector('.next');

function renderPosts() {
  container.innerHTML = '';
  const start = (currentPage - 1) * postsPerPage;
  const end = start + postsPerPage;

  for (let i = start; i < end && i < totalPosts; i++) {
    const post = document.createElement('div');
    post.className = 'post';
    post.textContent = `المنشور ${i + 1}`;
    container.appendChild(post);
  }

  prevButton.disabled = currentPage === 1;
  nextButton.disabled = currentPage === totalPages;
}

prevButton.addEventListener('click', () => {
  if (currentPage > 1) {
    currentPage--;
    renderPosts();
  }
});

nextButton.addEventListener('click', () => {
  if (currentPage < totalPages) {
    currentPage++;
    renderPosts();
  }
});

renderPosts();
  
</script>

</body>
</html>
