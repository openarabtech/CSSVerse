<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Progressive Disclosure"/>
	<link rel="icon" type="image/x-icon" href="../../../../../favicon.png">
	<title>EXAMPLE 4</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

</head>
<style>
body {

  font-family: "Noto Kufi Arabic", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-weight: 400;
  padding: 30px;
  display: flex;
  justify-content: center;
  

} 

.product-preview {
max-width: 300px;
border: 1px solid #ccc;
padding: 16px;
border-radius: 8px;
background: #fff;
text-align: center;
}

.product-preview img {
width: 100%;
border-radius: 4px;
margin-bottom: 10px;
}

.price {
font-weight: bold;
color: #333;
margin: 10px 0;
}

.info-toggle {
background-color: #007bff;
color: white;
border: none;
padding: 10px 16px;
font-size: 1rem;
border-radius: 5px;
cursor: pointer;
transition: background-color 0.2s ease;
}

.info-toggle:hover,
.info-toggle:focus {
background-color: #0056b3;
outline: none;
}

.product-info {
margin-top: 15px;
text-align: left;
background-color: #f9f9f9;
border: 1px solid #ddd;
padding: 12px;
border-radius: 6px;
}

.hidden {
display: none;
}







</style>

<body>

<div class="product-preview">
  <img src="https://placehold.co/150x150" alt="Example Product Image" />

  <h3>منتج نموذجي</h3>
  <p class="price">$49.99</p>
  <button class="info-toggle" aria-expanded="false" aria-controls="product-info">
    مزيد من المعلومات
  </button>
  <div id="product-info" class="product-info hidden" tabindex="-1">
    <p>هذا المنتج مصنوع من مواد عالية الجودة ويأتي مع ضمان لمدة عامين. وهو مثالي للاستخدام اليومي.</p>
    <ul>
      <li>متين وخفيف الوزن</li>
      <li>متوفر بألوان متعددة</li>
      <li>شحن مجاني مشمول</li>
    </ul>
  </div>
</div>



<script>

const toggleBtn = document.querySelector('.info-toggle');
const infoPanel = document.getElementById('product-info');

toggleBtn.addEventListener('click', () => {
  const isHidden = infoPanel.classList.toggle('hidden');
  toggleBtn.setAttribute('aria-expanded', !isHidden);
  toggleBtn.textContent = isHidden ? 'مزيد من المعلومات' : 'إخفاء المعلومات';

  if (!isHidden) {
    infoPanel.focus();
  }
});

</script>

</body>
</html>
