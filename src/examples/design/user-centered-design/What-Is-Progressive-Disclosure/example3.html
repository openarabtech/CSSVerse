<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Progressive Disclosure"/>
	<link rel="icon" type="image/x-icon" href="../../../../../favicon.png">
	<title>EXAMPLE 3</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

</head>
<style>
body {

  font-family: "Noto Kufi Arabic", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-weight: 400;
  

} 

.info-section {
font-family: sans-serif;
max-width: 400px;
margin: 30px auto;
border: 1px solid #ccc;
padding: 20px;
border-radius: 8px;
background-color: #fff;
}

h2 {
margin-top: 0;
}

.advanced-options {
margin-top: 20px;
}

#toggle-advanced-btn {
background-color: #007bff;
color: white;
border: none;
padding: 10px 16px;
font-size: 1rem;
border-radius: 5px;
cursor: pointer;
transition: background-color 0.25s ease;
}

#toggle-advanced-btn:hover,
#toggle-advanced-btn:focus {
background-color: #0056b3;
outline: none;
}

.hidden {
display: none;
}

#advanced-details {
margin-top: 15px;
padding: 15px;
border: 1px solid #ddd;
border-radius: 6px;
background-color: #f7f9fc;
}






</style>

<body>


<div class="info-section">
  <h2>ملخص الطلب</h2>
  <p><strong>العناصر في عربة التسوق:</strong> 3</p>
  <p><strong>السعر الإجمالي:</strong> $75.00</p>
  <div class="advanced-options">
    <button id="toggle-advanced-btn" aria-expanded="false" aria-controls="advanced-details">
      إظهار الخيارات المتقدمة
    </button>
    <div id="advanced-details" class="hidden" tabindex="-1">
      <p>أدخل رموز القسائم، أو اختر تغليف الهدايا، أو حدد تفضيلات الشحن من هنا.</p>
      <form>
        <label for="coupon">رمز القسيمة:</label><br />
        <input type="text" id="coupon" name="coupon" /><br /><br />
        <label>
          <input type="checkbox" name="gift-wrap" /> غلّف هذا الطلب كهدية
        </label><br /><br />
        <label for="shipping">طريقة الشحن:</label><br />
        <select id="shipping" name="shipping">
          <option value="standard">قياسي (مجاني)</option>
          <option value="express">سريع (10.00 دولاراً)</option>
        </select>
      </form>
    </div>
  </div>
</div>


<script>

const toggleBtn = document.getElementById('toggle-advanced-btn');
const advancedDetails = document.getElementById('advanced-details');

toggleBtn.addEventListener('click', () => {
  const isHidden = advancedDetails.classList.toggle('hidden');
  toggleBtn.setAttribute('aria-expanded', !isHidden);

  if (!isHidden) {
    advancedDetails.focus();
  }
});

</script>

</body>
</html>
