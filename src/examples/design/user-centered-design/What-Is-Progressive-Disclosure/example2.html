<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Progressive Disclosure"/>
	<link rel="icon" type="image/x-icon" href="../../../../../favicon.png">
	<title>EXAMPLE 2</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">

</head>
<style>
body {

  font-family: "Noto Kufi Arabic", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-weight: 400;
  

} 

.product-list {
font-family: sans-serif;
display: flex;
gap: 20px;
max-width: 800px;
margin: 20px auto;
flex-wrap: nowrap;
}

.product {
border: 1px solid #ccc;
border-radius: 8px;
padding: 10px;
width: 180px;
box-shadow: 0 2px 6px rgba(0,0,0,0.1);
position: relative;
}

.product img {
width: 100%;
border-radius: 6px;
cursor: pointer;
display: block;
margin-bottom: 8px;
}

.details-btn {
background-color: #007bff;
border: none;
color: white;
padding: 6px 12px;
font-size: 0.9rem;
border-radius: 5px;
cursor: pointer;
width: 100%;
transition: background-color 0.3s ease;
}

.details-btn:hover,
.details-btn:focus {
background-color: #0056b3;
outline: none;
}

.product-details {
margin-top: 10px;
background-color: #f7f9fc;
border: 1px solid #ddd;
border-radius: 6px;
padding: 8px;
font-size: 0.9rem;
}

.hidden {
display: none;
}






</style>

<body>

<div class="product-list">
  <div class="product" tabindex="0" aria-expanded="false" aria-controls="details-1">
    <img src="https://placehold.co/150x150" alt="Example Product Image" />

    <button class="details-btn" aria-label="Show more details for Product 1">مزيد من التفاصيل</button>
    <div id="details-1" class="product-details hidden" tabindex="-1">
      <p><strong>المنتج 1:</strong> هذا منتج رائع يتمتع بمزايا مذهلة ستنال إعجابك.</p>
      <ul>
        <li>الميزة أ</li>
        <li>الميزة ب</li>
        <li>الميزة ج</li>
      </ul>
    </div>
  </div>

  <div class="product" tabindex="0" aria-expanded="false" aria-controls="details-2">
    <img src="https://placehold.co/150x150" alt="Example Product Image" />

    <button class="details-btn" aria-label="Show more details for Product 2">مزيد من التفاصيل</button>
    <div id="details-2" class="product-details hidden" tabindex="-1">
      <p><strong>المنتج 2:</strong> منتج رائع آخر يتمتع بفوائد عديدة لاستخدامك اليومي.</p>
      <ul>
        <li>الفائدة 1</li>
        <li>الفائدة 2</li>
        <li>الفائدة 3</li>
      </ul>
    </div>
  </div>
</div>



<script>

document.querySelectorAll('.details-btn').forEach((button) => {
  button.addEventListener('click', () => {
    const product = button.closest('.product');
    const details = product.querySelector('.product-details');
    const isHidden = details.classList.toggle('hidden');
    product.setAttribute('aria-expanded', !isHidden);

    if (!isHidden) {
      details.focus();
      button.textContent = 'Hide details';
    } else {
      button.textContent = 'More details';
    }
  });
});

</script>

</body>
</html>
